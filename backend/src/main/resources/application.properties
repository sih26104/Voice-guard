spring.application.name=voiceguard-backend
server.port=8080

# FastAPI AI-detection service (configurable; never hard-coded at call sites)
ai.base-url=http://127.0.0.1:8000
ai.connect-timeout-ms=3000
ai.read-timeout-ms=20000
ai.max-upload-bytes=26214400

# Multipart limits for /api/analyze (must accommodate ai.max-upload-bytes)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
