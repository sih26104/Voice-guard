spring.application.name=voiceguard-backend

# Render port configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# FastAPI AI-detection service
ai.base-url=${AI_BASE_URL:http://127.0.0.1:8000}
ai.connect-timeout-ms=3000
ai.read-timeout-ms=20000
ai.max-upload-bytes=26214400

# Multipart limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
